
name: business_supply_app
description: "Business Supply management application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local storage
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2+1
  path: ^1.9.1

  # Image/file handling
  image_picker: ^1.1.2
  file_picker: ^10.3.2
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

